[package]
name = "sotto-setup"
version = "0.1.0"
edition = "2021"
description = "Sotto's themed setup window: shows the app's own screens and runs the NSIS installer silently behind them."

# Its own crate, not a member of the app's: it embeds the app's finished
# installer, so it builds after it (scripts/build-setup.ps1).
[workspace]

[dependencies]
# The versions the app's Tauri already pulls in, so nothing new downloads.
tao = "0.35.3"
wry = "0.55.1"
serde_json = "1"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
